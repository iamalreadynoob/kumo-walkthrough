[project]
name="kumo_walkthrough"
version="0.0.1"
requires-python=">= 3.12"
dependencies = [
    "catboost>=1.2.10",
    "datasets>=5.1.0",
    "hyperopt>=0.3.0",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "ruff>=0.17.4",
    "scikit-learn>=1.9.1",
    "structured-data-models>=0.2.1",
    "torch>=2.15.0",
]

[tool.ruff]
line-length = 88
indent-width = 4
exclude = [
    "__init__.py",
    ".env",
    ".gitignore",
    "requirements.txt",
    "uv.lock",
    ".claude/skills",  # vendored third-party skills
]
force-exclude = true

[tool.ruff.lint]
select = [
    "F",   # pyflakes
    "E",   # pycodestyle
    "W",   # whitespace and newlines
    "I",   # isort
    "UP",  # modernize
    "ANN", # flake8 type annotations
    "S",   # flake8 bandit
    "B",   # flake8 bugbear
    "C4",  # flake8 comprehensions
    "COM", # flake8 commas
    "T20", # flake8 print
    "SIM", # flake8 simplify
    "ARG", # flake8 unused arguments
    "DTZ", # flake8 datetimes
    "Q",   # flake8 quotes
    "TCH", # flake8 typecheck
    "D",   # pydocstyle
    "RUF", # ruff-specific rules
]
fixable = ["ALL"]
ignore = [
    "D203", "D213", "D215", "D400", "D401", "D404", "D406",
    "D407", "D408", "D409", "D413", "UP035", "UP006", "D107",
    "LOG015", "UP015", "ANN204", "B008"
]
allowed-confusables = ["ı"]

[tool.ruff.lint.per-file-ignores]
"test*" = ["D", "ANN"]
"tests/**" = ["D", "ANN", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 88

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
